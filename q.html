<body id="home">
    <header>
        <h1>A Repository of Quotes I Like</h1>
    </header>
    <main id="content">
        <hr>
        <figure>
            <blockquote>
                <p>Ever since happiness heard your name, it has been running through the streets trying to find you.</p>
            </blockquote>
            <figcaption>&mdash; Hafez</figcaption>
        </figure>
        <hr>
        <figure>
            <blockquote>
                <p>You can pick all of the flowers, but you can’t stop the spring.</p>
            </blockquote>
            <figcaption>&mdash; Pablo Neruda</figcaption>
        </figure>
        <hr>
        <figure>
            <blockquote>
                <p>But anything worth doing is worth doing badly.</p>
            </blockquote>
            <figcaption>&mdash; Jack Gilbert</figcaption>
        </figure>
        <hr>
        <figure>
            <blockquote>
                <p>Do you guess I have some intricate purpose? Well, I have—for the Fourth Month showers have, and the
                    mica on the side of a rock has.</p>
            </blockquote>
            <figcaption>&mdash; Walt Whitman</figcaption>
        </figure>
        <hr>
        <figure>
            <blockquote>
                <p>Self-knowledge is always bad news.</p>
            </blockquote>
            <figcaption>&mdash; John Barth</figcaption>
        </figure>
        <hr>
        <figure>
            <blockquote>
                <p>You climb the ladder just to realize it was against the wrong wall.</p>
            </blockquote>
            <figcaption>&mdash; Thomas Merton</figcaption>
        </figure>
        <hr>
        <figure>
            <blockquote>
                <p>Security is mostly a superstition. It does not exist in nature, nor do the children of men as a whole
                    experience it. Avoiding danger is no safer in the long run than outright exposure. Life is either a
                    daring adventure, or nothing.</p>
            </blockquote>
            <figcaption>&mdash; Helen Keller</figcaption>
        </figure>
        <hr>
        <figure>
            <blockquote>
                <p>The lights begin to twinkle from the rocks:<br>
                    The long day wanes: the slow moon climbs: the deep<br>
                    moans round with many voices. Come, my friends,<br>
                    'Tis is not too late to seek a newer world.</p>
            </blockquote>
            <figcaption>&mdash; Alfred, Lord Tennyson</figcaption>
        </figure>
        <hr>
        <figure>
            <blockquote>
                <p>The thief left it behind<br>the moon<br>at my window.</p>
            </blockquote>
            <figcaption>&mdash; Ryokan</figcaption>
        </figure>
        <hr>
        <figure>
            <blockquote>
                <p>It is good knowing that glasses are to drink from; the bad thing is not to know what thirst is for.
                    You say nothing is created anew, don’t worry about it, with the mud of the Earth, make a cup from
                    which your brother can drink.</p>
            </blockquote>
            <figcaption>&mdash; Antonio Machado</figcaption>
        </figure>
        <hr>
        <figure>
            <blockquote>
                <p>There is one simple thing wrong with you--you think you have plenty of time. You think your life is
                    going to last forever.</p>
            </blockquote>
            <figcaption>&mdash; Carlos Castaneda</figcaption>
        </figure>
        <hr>
        <figure>
            <blockquote>
                <p>Overcome all bitterness because you are not up to the magnitude of pain that was entrusted to you.
                </p>
            </blockquote>
            <figcaption>&mdash; Sufi saying</figcaption>
        </figure>
        <hr>
        <figure>
            <blockquote>
                <p>Although the world is full of suffering, it is also full of overcoming it.</p>
            </blockquote>
            <figcaption>&mdash; Helen Keller</figcaption>
        </figure>
        <hr>
        <figure>
            <blockquote>
                <p>Don’t trust means or techniques, some people work and become wealthy, others do the same and remain
                    poor. Marriage fills one with energy, another it drains. Don’t trust means, they change. A means
                    flails about like a donkeys tail. Always add the gratitude clause to any sentence. If God wills,
                    then go and do your best.</p>
            </blockquote>
            <figcaption>&mdash; Rumi</figcaption>
        </figure>
        <hr>
        <figure>
            <blockquote>
                <p>Be humble, for you are made of mud. Be noble, for you are made of stars.</p>
            </blockquote>
            <figcaption>&mdash; Serbian Proverb</figcaption>
        </figure>
        <hr>
        <figure>
            <blockquote>
                <p>Perhaps he knew, as I did not, that the Earth was made round so that we would not see too far down
                    the road.</p>
            </blockquote>
            <figcaption>&mdash; Karen Blixen</figcaption>
        </figure>
        <hr>
        <figure>
            <blockquote>
                <p>Start your work from where you live, with the small concrete needs right around you. Help ease
                    tension in your workplace. Help feed the person right in front of you. Personalism holds that we
                    each have a deep personal obligation to live simply, to look after the needs of our brothers and
                    sisters, and to share in the happiness and misery they are suffering.</p>
            </blockquote>
            <figcaption>&mdash; David Brooks</figcaption>
        </figure>
    </main>
